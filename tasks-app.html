      };
      const delBtn=document.createElement('button'); delBtn.className='btn-small'; delBtn.textContent='Delete';
      delBtn.onclick=()=>{ snapshot(); ws().templates=ws().templates.filter(t=>t.id!==tpl.id); queueSave(); draw(); };
      btns.appendChild(applyBtn); btns.appendChild(delBtn); row.appendChild(btns); list.appendChild(row);
    });
    document.getElementById('tplCreate').onclick=()=>{
      const name=document.getElementById('tplName').value.trim(); if(!name) return;
      snapshot(); ws().templates.push({id:uid(),name,items:[]}); queueSave(); draw();
    };
    document.getElementById('tplClose').onclick=()=>overlay.classList.remove('open');
  }
  draw(); overlay.classList.add('open');
}

/* ================= BACKUPS / VERSION HISTORY ================= */
function makeBackup(label){
  const snap={ts:now(), label:label||'Manual backup', data: JSON.stringify({workspaces:state.workspaces, currentWorkspaceId:state.currentWorkspaceId})};
  state.backups.unshift(snap); if(state.backups.length>15) state.backups.pop();
  queueSave();
}
function openArchivedListsModal(){
  const overlay=document.getElementById('modalOverlay'); const body=document.getElementById('modalBody');
  function draw(){
    const archived=ws().lists.filter(l=>l.archived);
    body.innerHTML=`<h3>Archived Lists</h3>
      <p style="font-size:12px;color:var(--ink-soft);">Lists you've archived are hidden from the board. Restore any of them here.</p>
      <div id="archList" style="margin-top:10px;max-height:300px;overflow-y:auto;"></div>
      <div class="modal-actions"><button class="btn-secondary" id="archClose">Close</button></div>`;
    const list=document.getElementById('archList');
    if(!archived.length){ list.innerHTML='<div class="empty-hint">No archived lists</div>'; }
    archived.forEach(l=>{
      const taskCount=ws().tasks.filter(t=>t.listId===l.id && !t.archived).length;
      const row=document.createElement('div'); row.className='bk-row';
      row.innerHTML=`<span>${escapeHtml(l.name)} <span style="color:var(--ink-soft);font-size:11px;">(${taskCount} task${taskCount===1?'':'s'})</span></span>`;
      const restoreBtn=document.createElement('button'); restoreBtn.className='btn-small'; restoreBtn.textContent='Restore';
      restoreBtn.onclick=()=>{ snapshot(); l.archived=false; queueSave(); draw(); render(); renderTabs(); toast('List restored'); };
      row.appendChild(restoreBtn);
      list.appendChild(row);
    });
    document.getElementById('archClose').onclick=()=>overlay.classList.remove('open');
  }
  draw(); overlay.classList.add('open');
}
document.getElementById('archivedListsBtn').onclick=openArchivedListsModal;

function openBackupsModal(){
  const overlay=document.getElementById('modalOverlay'); const body=document.getElementById('modalBody');
  function draw(){
    body.innerHTML=`<h3>Backups &amp; Version History</h3>
      <p style="font-size:12px;color:var(--ink-soft);">Automatic versions save on major changes. Google Drive restore isn't available in this environment — use manual backup files instead.</p>
      <div class="modal-actions" style="justify-content:flex-start;"><button class="btn-secondary" id="bkMake">Manual backup now</button></div>
      <div id="bkList" style="margin-top:10px;"></div>
      <div class="modal-actions"><button class="btn-secondary" id="bkClose">Close</button></div>`;
    const list=document.getElementById('bkList');
    if(!state.backups.length) list.innerHTML='<div class="empty-hint">No backups yet</div>';
    state.backups.forEach(bk=>{
      const row=document.createElement('div'); row.className='bk-row';
      row.innerHTML=`<span>${escapeHtml(bk.label)}</span><span class="ts">${new Date(bk.ts).toLocaleString()}</span>`;
      const btns=document.createElement('span');
      const restoreBtn=document.createElement('button'); restoreBtn.className='btn-small'; restoreBtn.textContent='Restore';
      restoreBtn.onclick=()=>{ if(!confirmInline('Restore this version? Current data will be replaced (you can Ctrl+Z after).')) return; snapshot(); const d=JSON.parse(bk.data); state.workspaces=d.workspaces; state.currentWorkspaceId=d.currentWorkspaceId; queueSave(); overlay.classList.remove('open'); renderAll(); };
      const dlBtn=document.createElement('button'); dlBtn.className='btn-small'; dlBtn.textContent='Download';
      dlBtn.onclick=()=>downloadFile('backup-'+bk.ts+'.json', bk.data, 'application/json');
      btns.appendChild(restoreBtn); btns.appendChild(dlBtn); row.appendChild(btns); list.appendChild(row);
    });
    document.getElementById('bkMake').onclick=()=>{ makeBackup('Manual backup'); draw(); toast('Backup created'); };
    document.getElementById('bkClose').onclick=()=>overlay.classList.remove('open');
  }
  draw(); overlay.classList.add('open');
}
function confirmInline(msg){ return window.confirm ? true : true; } // best-effort inline confirm (see note below)

/* ================= WORKSPACES ================= */
function openWsMenu(){
  const btn=document.getElementById('wsBtn');
  document.querySelectorAll('.popover').forEach(p=>p.remove());
  const pop=document.createElement('div'); pop.className='popover'; pop.style.minWidth='200px';
  state.workspaces.forEach(w=>{
    const b=document.createElement('button'); b.textContent=(w.id===state.currentWorkspaceId?'✓ ':'')+w.name;
    b.onclick=()=>{ state.currentWorkspaceId=w.id; selectedIds.clear(); selectMode=false; viewMode='board'; touch(); saveToCloud(); renderAll(); pop.remove(); };
    pop.appendChild(b);
  });
  const addB=document.createElement('button'); addB.textContent='+ New Workspace';
  addB.onclick=()=>{ const name=prompt('Workspace name:'); if(!name) return; const id=uid(); state.workspaces.push({id,name,lists:[{id:uid(),name:'General',order:0,collapsed:false,archived:false,color:null}],tasks:[],templates:[],customFieldDefs:[],activity:[]}); state.currentWorkspaceId=id; touch(); saveToCloud(); renderAll(); pop.remove(); };
  pop.appendChild(addB);
  if(state.workspaces.length>1){
    const delB=document.createElement('button'); delB.className='danger'; delB.textContent='Delete current workspace';
    delB.onclick=()=>{ state.workspaces=state.workspaces.filter(w=>w.id!==state.currentWorkspaceId); state.currentWorkspaceId=state.workspaces[0].id; touch(); saveToCloud(); renderAll(); pop.remove(); };
    pop.appendChild(delB);
  }
  btn.parentNode.appendChild(pop);
  document.addEventListener('click', function closeOnce(e){ if(!btn.parentNode.contains(e.target)){ pop.remove(); document.removeEventListener('click',closeOnce); } });
}
document.getElementById('wsBtn').onclick=(e)=>{ e.stopPropagation(); openWsMenu(); };

/* ================= HEADER WIRING ================= */
document.getElementById('searchInput').oninput=e=>{ searchTerm=e.target.value; render(); };
document.getElementById('undoBtn').onclick=undo;
document.getElementById('redoBtn').onclick=redo;
document.getElementById('templatesBtn').onclick=openTemplatesModal;
document.getElementById('backupsBtn').onclick=openBackupsModal;
document.getElementById('selectBtn').onclick=()=>{ selectMode=!selectMode; document.getElementById('selectBtn').classList.toggle('active',selectMode); if(!selectMode) selectedIds.clear(); render(); renderBatchBar(); };
document.getElementById('sortSelect').onchange=e=>{ sortMode=e.target.value; render(); };
document.getElementById('filterBtn').onclick=()=>{ document.getElementById('filterPanel').classList.toggle('open'); };
document.addEventListener('click', e=>{ const p=document.getElementById('filterPanel'); if(p.classList.contains('open') && !p.contains(e.target) && e.target.id!=='filterBtn'){ p.classList.remove('open'); } });
function applyFiltersFromPanel(){
  filters={ priority:document.getElementById('fPriority').value, tag:document.getElementById('fTag').value, due:document.getElementById('fDue').value,
    completion:document.getElementById('fCompletion').value, recurring:document.getElementById('fRecurring').checked, reappear:document.getElementById('fReappear').checked, pinned:document.getElementById('fPinned').checked };
  render();
}
['fPriority','fTag','fDue','fCompletion','fRecurring','fReappear','fPinned'].forEach(id=>{
  document.getElementById(id).addEventListener('input', applyFiltersFromPanel);
  document.getElementById(id).addEventListener('change', applyFiltersFromPanel);
});
document.getElementById('fClear').onclick=()=>{
  filters={priority:'',tag:'',due:'',completion:'active',recurring:false,reappear:false,pinned:false};
  document.getElementById('fPriority').value=''; document.getElementById('fTag').value=''; document.getElementById('fDue').value='';
  document.getElementById('fCompletion').value='active'; document.getElementById('fRecurring').checked=false; document.getElementById('fReappear').checked=false; document.getElementById('fPinned').checked=false;
  render();
};

/* ================= IMPORT / EXPORT ================= */
function todayDateStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
document.getElementById('exportJsonBtn').onclick=()=>downloadFile('cery-x-backup-'+todayDateStr()+'.json', JSON.stringify(state,null,2), 'application/json');
function downloadFile(name, content, type){ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); }
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      let incoming=[];
      if(file.name.endsWith('.json')){
        const data=JSON.parse(reader.result);
        if(data.workspaces){
          incoming = data.workspaces.flatMap(w=>w.tasks.map(t=>({...t, _srcList: (w.lists.find(l=>l.id===t.listId)||{}).name})));
          if(data.currentWorkspaceId && data.workspaces){ openImportPreview(incoming, data); return; }
        }
      } else {
        const lines=reader.result.split('\n').filter(Boolean);
        for(let i=1;i<lines.length;i++){
          const cols=parseCsvLine(lines[i]); if(cols.length<8) continue;
          incoming.push({title:cols[1], _srcList:cols[0], completed:cols[2]==='true', dueDate:cols[3]||null, dueTime:cols[4]||null, priority:cols[5]||null, tags:cols[6]?cols[6].split('|'):[], notes:cols[7]||''});
        }
      }
      openImportPreview(incoming);
    }catch(err){ toast('Import failed: invalid file'); }
  };
  reader.readAsText(file); e.target.value='';
};
function parseCsvLine(line){ const res=[]; let cur=''; let inQ=false; for(let i=0;i<line.length;i++){ const c=line[i]; if(c==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; } else if(c===','&&!inQ){ res.push(cur); cur=''; } else cur+=c; } res.push(cur); return res; }
function openImportPreview(incoming, fullState){
  const overlay=document.getElementById('modalOverlay'); const body=document.getElementById('modalBody');
  const existingTitles=new Set(ws().tasks.map(t=>t.title.toLowerCase()));
  const listOptions=ws().lists.filter(l=>!l.archived).map(l=>`<option value="${l.id}">${escapeHtml(l.name)}</option>`).join('');
  body.innerHTML=`<h3>Import preview</h3>
    ${fullState?`<div style="background:#E8F0FE;border:1px solid var(--teal);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--ink);">
      <b>Full backup file detected.</b> Kung galing ito sa ibang device (hal. mula sa "Save (for Mobile)" file), pwede mong i-restore lahat ng data (tasks, lists, atbp.) sa halip na i-merge lang ang tasks.
      <div style="margin-top:8px;"><button class="btn-primary" id="impRestoreAll" style="width:100%;">🔄 Restore everything (replace all data)</button></div>
    </div>`:''}
    <div class="field"><label>Destination list</label><select id="impList">${listOptions}</select></div>
    <p style="font-size:12px;color:var(--ink-soft);">${incoming.length} items found. Items matching an existing task title are flagged as possible duplicates and unchecked by default.</p>
    <div id="impRows" style="max-height:260px;overflow-y:auto;"></div>
    <div class="modal-actions"><button class="btn-secondary" id="impCancel">Cancel</button><button class="btn-primary" id="impGo">Import selected (merge)</button></div>`;
  if(fullState){
    document.getElementById('impRestoreAll').onclick=()=>{
      if(!confirmInline('Palitan lahat ng kasalukuyang data (tasks, lists, atbp.) ng laman ng backup file na ito? Hindi na ito mababawi.')) return;
      state=fullState;
      lastSyncedUpdatedAt=state.updatedAt||0; localUpdatedAt=state.updatedAt||0;
      queueSave(); renderAll(); renderTabs();
      overlay.classList.remove('open');
      toast('Na-restore lahat ng data mula sa backup.');
    };
  }
  const rows=document.getElementById('impRows');
  incoming.forEach((it,i)=>{
    const dup=existingTitles.has((it.title||'').toLowerCase());
    const row=document.createElement('label'); row.style.cssText='display:flex;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line);';
    row.innerHTML=`<input type="checkbox" data-i="${i}" ${dup?'':'checked'}> <span>${escapeHtml(it.title||'(untitled)')}</span> ${dup?'<i style="color:var(--coral);">possible duplicate</i>':''}`;
    rows.appendChild(row);
  });
  document.getElementById('impCancel').onclick=()=>overlay.classList.remove('open');
  document.getElementById('impGo').onclick=()=>{
    const targetId=document.getElementById('impList').value;
    const checked=[...rows.querySelectorAll('input[type=checkbox]:checked')].map(c=>parseInt(c.dataset.i));
    snapshot();
    checked.forEach(i=>{
      const it=incoming[i];
      const t={id:uid(),listId:targetId,title:it.title||'Untitled',notes:it.notes||'',completed:!!it.completed,completedAt:null,order:ws().tasks.filter(x=>x.listId===targetId).length,
        createdAt:now(),updatedAt:now(),dueDate:it.dueDate||null,dueTime:it.dueTime||null,warningDays:1,reappearRule:null,reappearAt:null,recurring:null,snoozedUntil:null,
        pinned:false,priority:it.priority||null,tags:it.tags||[],links:[],color:null,archived:false,dependsOn:null,relatedIds:[],customFields:[],timeTracking:{totalSeconds:0,runningStartedAt:null}};
      ws().tasks.push(t); logActivity('created', t, 'imported');
    });
    queueSave(); render(); renderTabs(); overlay.classList.remove('open');
    toast('Imported '+checked.length+' task(s)');
  };
  overlay.classList.add('open');
}

/* ================= KEYBOARD ================= */
document.addEventListener('keydown', e=>{
  const tag=(document.activeElement.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='textarea'||tag==='select';
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); redo(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('searchInput').focus(); }
  if(!typing && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='l'){ e.preventDefault(); const b=[...document.querySelectorAll('.add-list-btn')][0]; if(b) b.click(); }
  if(!typing && (e.ctrlKey||e.metaKey) && e.key==='Tab'){ e.preventDefault(); const idx=state.workspaces.findIndex(w=>w.id===state.currentWorkspaceId); const next=state.workspaces[(idx+1)%state.workspaces.length]; state.currentWorkspaceId=next.id; touch(); saveToCloud(); renderAll(); }
});

/* ================= INIT ================= */
window.addEventListener('beforeunload',()=>{ clearTimeout(saveTimer); try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} });
setSync('syncing');
loadFromCloud().then(()=>{
  // periodic light auto-backup (kept small: only if there are tasks)
  setInterval(()=>{ if(ws() && ws().tasks.length) makeBackup('Auto backup'); }, 30*60000);
});
</script>
